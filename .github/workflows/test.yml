name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run RTL tests
        shell: pwsh
        run: npm test

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors) {
              $errors += $parseErrors
              Write-Host "Parse errors in $($_.FullName)" -ForegroundColor Red
              $parseErrors | Format-List
            }
          }
          if ($errors.Count -gt 0) { exit 1 }

      - name: Verify package manifest
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Verify-Package.ps1
