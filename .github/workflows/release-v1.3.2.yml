name: publish-v1.3.2-release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.3.2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT='claude-desktop-rtl-patch-fa'
          STAGE="$RUNNER_TEMP/release-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/$ROOT"

          while IFS= read -r file; do
            case "$file" in
              .gitattributes|.github/workflows/release-v1.3.2.yml)
                continue
                ;;
            esac
            mkdir -p "$STAGE/$ROOT/$(dirname "$file")"
            cp "$file" "$STAGE/$ROOT/$file"
          done < <(git ls-files)

          cd "$STAGE"
          zip -qr "$GITHUB_WORKSPACE/claude-desktop-rtl-patch-fa-v1.3.2.zip" "$ROOT"
          cd "$GITHUB_WORKSPACE"
          sha256sum claude-desktop-rtl-patch-fa-v1.3.2.zip > claude-desktop-rtl-patch-fa-v1.3.2.zip.sha256
          cat claude-desktop-rtl-patch-fa-v1.3.2.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.3.2 >/dev/null 2>&1; then
            echo 'Release v1.3.2 already exists; refusing to overwrite it.'
            exit 1
          fi

          gh release create v1.3.2 \
            claude-desktop-rtl-patch-fa-v1.3.2.zip \
            claude-desktop-rtl-patch-fa-v1.3.2.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target ae81921f2816763028b4c4b756e4d223b282372d \
            --title 'v1.3.2 — Secure Hardened Persian RTL' \
            --notes-file RELEASE_NOTES-v1.3.2.md
