name: bootstrap-public-release-4

on:
  push:
    branches:
      - publish-v1.3.2
    paths:
      - '.github/workflows/bootstrap4.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified release archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            bootstrap/source.part00 \
            bootstrap/source.part01 \
            bootstrap/source.part02 \
            bootstrap/source.part03 \
            bootstrap/source.part04 \
            bootstrap/source.part05a \
            bootstrap/source.part05b \
            bootstrap/source.part05c \
            bootstrap/source.part05d \
            bootstrap/source.part06a \
            bootstrap/source.part06b \
            bootstrap/source.part06c \
            bootstrap/source.part06d \
            bootstrap/source.part07 \
            > payload.b64
          test "$(wc -c < payload.b64)" -eq 157992
          base64 -d payload.b64 > payload.zip
          echo 'b3a27d5c613ee553d3e0853d161d8a4080904a02674873354d73c155bda41a11  payload.zip' | sha256sum -c -
          unzip -t payload.zip

      - name: Replace bootstrap tree with final v1.3.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/claude-rtl-release
          mkdir -p /tmp/claude-rtl-release
          unzip -q payload.zip -d /tmp/claude-rtl-release
          test -f /tmp/claude-rtl-release/claude-desktop-rtl-patch-fa/patch.ps1
          rsync -a --delete --exclude '.git/' /tmp/claude-rtl-release/claude-desktop-rtl-patch-fa/ ./
          rm -f payload.b64 payload.zip

      - name: Commit final public source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Publish v1.3.2 secure hardened release'
          git push origin HEAD:publish-v1.3.2
