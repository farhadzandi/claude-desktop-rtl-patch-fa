name: Bug report
description: Report a reproducible problem with the Persian RTL patch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove sensitive information from logs before posting.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Desktop version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - Install / Re-Apply
        - Restore
        - Custom Font
        - Security Audit / Verify
        - Legacy ACL Repair
        - Legacy Cleanup
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized log excerpt
      description: Do not paste credentials, conversations, or private corporate information.
